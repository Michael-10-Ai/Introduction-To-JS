<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Assignment1.css">
</head>

<body>

    <form action="#" id="signup-form">
        <h1>Create Account</h1>
        <p class="subtitle">Try clicking submit without typing anything</p>

        <div class="form-group">
            <label for="">First Name</label>
            <input type="text" name="" id="first-name" placeholder="e.g samuel">
            <small class="error-message" id="first-name-Error"></small>
        </div>

        <div class="form-group">
            <label for="">Last Name</label>
            <input type="text" name="" id="last-name" placeholder="e.g james">
            <small class="error-message" id="last-name-Error"></small>
        </div>

        <div class="form-group">
            <label for="">Email</label>
            <input type="email" name="" id="email" placeholder="samueljames@gmail.com">
            <small class="error-message" id="email-Error"></small>
        </div>

        <div class="form-group">
            <label for="">Phone Number</label>
            <input type="tel" name="" id="phone-number" placeholder="+234...">
            <small class="error-message" id="phone-number-Error"></small>
        </div>

        <div class="form-group">
            <label for="">Password</label>
            <input type="password" name="" id="password" placeholder="Enter a Password">
            <small class="error-message" id="password-Error"></small>
        </div>

        <button type="submit" id="button">Submit</button>

        <p class="success-message" id="successMessage"></p>
    </form>

    <script src="Assignment1.js"></script>
</body>

</html>
