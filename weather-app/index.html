<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Weather App</h1>

  <!-- The user types a city here -->
  <input id="city" type="text" placeholder="Type a city, e.g. Lagos">
  <button id="btn">Get Weather</button>

  <!-- JavaScript will put the weather inside this box -->
  <div id="result">
    <p id="loading"></p>
    <h2 id="city-text"></h2> 
        <p id="temp-text"></p>
        <p id="weather-text"></p>
        <p id="humidity-text"></p>
        <p id="pressure"></p>

  </div>

  <script src="script.js"></script>
</body>
</html>
